# ══════════════════════════════════════════════════════════════════════
#  Alacritty — macOS · dev setup
#  Docs: `man 5 alacritty` · `man 5 alacritty-bindings`
# ══════════════════════════════════════════════════════════════════════

[general]
live_config_reload = true
ipc_socket         = true          # enables `alacritty msg` (create-window, config)
import = [
  "~/.config/alacritty/themes/premium-noir.toml",
  # "~/.config/alacritty/themes/catppuccin-macchiato.toml",
  # "~/.config/alacritty/themes/tokyo-night-storm.toml",
]

# ── Environment ───────────────────────────────────────────────────────
# `alacritty` terminfo is installed in ~/.terminfo (undercurl, styled
# underlines, the terminal's real capabilities).
# If an SSH server doesn't know it:  infocmp -x alacritty | ssh host -- tic -x -
# Otherwise switch back to the commented line.
[env]
TERM = "alacritty"
# TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"                # copy/paste from remote nvim & tmux

[terminal.shell]
program = "/bin/zsh"
args    = ["--login"]

# ── Window ────────────────────────────────────────────────────────────
[window]
padding                   = { x = 16, y = 14 }
dynamic_padding           = true   # centered padding, no leftover strip
decorations               = "buttonless"
decorations_theme_variant = "Dark"
startup_mode              = "Windowed"
dynamic_title             = true
resize_increments         = true   # resize snaps to the cell grid
opacity                   = 0.55   # more see-through; blur = true makes up
                                   # for it by blurring what's behind.
                                   # Below ~0.45 the text starts fighting
                                   # with the background.
blur                      = true
option_as_alt             = "Both" # ⌥ = Alt/Meta → M-x, alt-maps nvim, readline

# ── Scrollback ────────────────────────────────────────────────────────
[scrolling]
history    = 100000
multiplier = 3

# ── Typography ────────────────────────────────────────────────────────
[font]
size                = 19.0
builtin_box_drawing = true         # crisp box-drawing (btop, lazygit, tables)

[font.normal]
family = "JetBrainsMono Nerd Font"
style  = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style  = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style  = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style  = "Bold Italic"

[font.offset]
x = 1
y = 2

[font.glyph_offset]
x = 0
y = 1

# ── Cursor ────────────────────────────────────────────────────────────
[cursor]
style            = { shape = "Block", blinking = "On" }
vi_mode_style    = { shape = "Block", blinking = "Off" }
blink_interval   = 600
blink_timeout    = 0               # never stops blinking
unfocused_hollow = true
thickness        = 0.17

# ── Selection / mouse ─────────────────────────────────────────────────
[selection]
save_to_clipboard     = false      # don't pollute the clipboard
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[mouse]
# false: the pointer stays visible while typing.
# `true' hid it on the first keystroke, which is what looked like
# "the cursor turns transparent".
hide_when_typing = false

[[mouse.bindings]]
mouse  = "Right"
action = "ExpandSelection"

# ── Bell: subtle ──────────────────────────────────────────────────────
[bell]
animation = "EaseOutExpo"
duration  = 60
color     = "#e3b778"

# ── Hints: open / copy without the mouse ──────────────────────────────
[hints]
alphabet = "asdfjkl;ghqwertyuiop"

# ⌃⇧O or ⌘+click → open URL / OSC 8 link
[[hints.enabled]]
command         = "open"
hyperlinks      = true
post_processing = true
persist         = false
mouse           = { enabled = true, mods = "Command" }
binding         = { key = "O", mods = "Control|Shift" }
regex           = '''(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>"\s{-}\^⟨⟩`\\]+'''

# ⌃⇧P → copy a file path spotted on screen (path:line:col included)
[[hints.enabled]]
action          = "Copy"
post_processing = true
persist         = false
binding         = { key = "P", mods = "Control|Shift" }
regex           = '(~|\.{1,2})?/[-\w./@+]+(:\d+){0,2}'

# ⌃⇧Y → copy a git hash / SHA
[[hints.enabled]]
action  = "Copy"
persist = false
binding = { key = "Y", mods = "Control|Shift" }
regex   = '\b[0-9a-f]{7,40}\b'

# ══════════════════════════════════════════════════════════════════════
#  Keyboard
#  Rule: ⌘ = terminal (native macOS) · ⌃ and ⌥ left alone for TUIs
#  (nvim, tmux, emacs, opencode) so no keybinding breaks.
# ══════════════════════════════════════════════════════════════════════
[keyboard]
bindings = [
  # ── Clipboard ───────────────────────────────────────────────────────
  { key = "C", mods = "Command", action = "Copy" },
  { key = "V", mods = "Command", action = "Paste" },
  { key = "V", mods = "Command", mode = "Vi|Search", action = "Paste" },

  # ── Native macOS windows & tabs ─────────────────────────────────────
  { key = "N", mods = "Command",         action = "CreateNewWindow" },
  { key = "N", mods = "Command|Shift",   action = "SpawnNewInstance" },
  { key = "T", mods = "Command",         action = "CreateNewTab" },
  { key = "]", mods = "Command|Shift",   action = "SelectNextTab" },
  { key = "[", mods = "Command|Shift",   action = "SelectPreviousTab" },
  { key = "1", mods = "Command",         action = "SelectTab1" },
  { key = "2", mods = "Command",         action = "SelectTab2" },
  { key = "3", mods = "Command",         action = "SelectTab3" },
  { key = "4", mods = "Command",         action = "SelectTab4" },
  { key = "5", mods = "Command",         action = "SelectTab5" },
  { key = "9", mods = "Command",         action = "SelectLastTab" },
  { key = "H", mods = "Command",         action = "Hide" },
  { key = "H", mods = "Command|Alt",     action = "HideOtherApplications" },
  { key = "M", mods = "Command",         action = "Minimize" },
  { key = "F", mods = "Command|Control", action = "ToggleSimpleFullscreen" },

  # ── Zoom ────────────────────────────────────────────────────────────
  { key = "=", mods = "Command", action = "IncreaseFontSize" },
  { key = "-", mods = "Command", action = "DecreaseFontSize" },
  { key = "0", mods = "Command", action = "ResetFontSize" },

  # ── Search & vi mode (keyboard nav in scrollback) ───────────────────
  { key = "F",      mods = "Command",       action = "SearchForward" },
  { key = "F",      mods = "Command|Shift", action = "SearchBackward" },
  { key = "Space",  mods = "Control|Shift", action = "ToggleViMode" },
  { key = "Escape", mode = "Search",        action = "SearchCancel" },

  # ── Scrollback ──────────────────────────────────────────────────────
  { key = "ArrowUp",   mods = "Command", action = "ScrollHalfPageUp" },
  { key = "ArrowDown", mods = "Command", action = "ScrollHalfPageDown" },
  { key = "Home",      mods = "Command", action = "ScrollToTop" },
  { key = "End",       mods = "Command", action = "ScrollToBottom" },

  # ⌘K: clears the screen AND the history (both actions run in order)
  { key = "K", mods = "Command", action = "ClearHistory" },
  { key = "K", mods = "Command", mode = "~Vi|~Search", chars = "\u000C" },

  # ── Line editing: macOS habits → readline/zsh controls ───────────────
  { key = "ArrowLeft",  mods = "Command", mode = "~Vi|~Search", chars = "\u0001" }, # ^A start of line
  { key = "ArrowRight", mods = "Command", mode = "~Vi|~Search", chars = "\u0005" }, # ^E end of line
  { key = "Backspace",  mods = "Command", mode = "~Vi|~Search", chars = "\u0015" }, # ^U kill the line
  { key = "Delete",     mods = "Command", mode = "~Vi|~Search", chars = "\u000B" }, # ^K kill to end of line

  # ── Newline without sending (Claude Code, opencode, aider…) ─────────
  { key = "Enter", mods = "Shift",   chars = "\u001B\r" },
  { key = "Enter", mods = "Command", chars = "\u001B\r" },
]
