[mgr]
# Columns: parent / current / preview
ratio = [1, 4, 3]
sort_by = "mtime"
sort_sensitive = false
sort_reverse = true
sort_dir_first = true
show_hidden = false
linemode = "mtime"

[preview]
max_width = 2000
max_height = 2000
cache_dir = "~/.cache/yazi"

[opener]
# Open with the default macOS app
open = [
  { run = 'open "$@"', desc = "Open", for = "macos" },
]

# Open in your editor (emacsclient if you want)
edit = [
  { run = '${EDITOR:-vim} "$@"', desc = "Edit", for = "unix" },
]
