run = ['move-node-to-workspace 04_Management']

# ── 08_Ops : infra & bases de donnees ─────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.docker.docker'
run = ['move-node-to-workspace 08_Ops']

[[on-window-detected]]
if.app-id = 'com.postmanlabs.mac'
run = ['move-node-to-workspace 08_Ops']

[[on-window-detected]]
if.app-id = 'org.jkiss.dbeaver.core.product'
run = ['move-node-to-workspace 08_Ops']

# ── 09_Divers : media ─────────────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace 09_Divers']

[[on-window-detected]]
if.app-id = 'com.colliderli.iina'
run = ['move-node-to-workspace 09_Divers']

[[on-window-detected]]
if.app-id = 'org.videolan.vlc'
run = ['move-node-to-workspace 09_Divers']
