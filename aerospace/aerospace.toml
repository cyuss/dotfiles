run = ['move-node-to-workspace 05_I.A']

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = ['move-node-to-workspace 05_I.A']

[[on-window-detected]]
if.app-id = 'ai.perplexity.mac'
run = ['move-node-to-workspace 05_I.A']

# ── 03_Work : communication ───────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.mimestream.Mimestream'
run = ['move-node-to-workspace 03_Work']

[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = ['move-node-to-workspace 03_Work']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace 03_Work']

# ── 04_Management : notes & organisation ──────────────────────────────
[[on-window-detected]]
