# ~/.config/aerospace/aerospace.toml
# AeroSpace 0.21.x
# FelixKratz-inspired layout + gaps

# ==================
# Config version
# ==================
# In v2, persistent-workspaces is no longer guessed from keybindings
# (upstream found that heuristic flaky): you have to declare it.
config-version = 2

persistent-workspaces = [
  '01_Main',
  '02_Coding',
  '03_Work',
  '04_Management',
  '05_I.A',
  '06_Web',
  '07_System',
  '08_Ops',
  '09_Divers',
]

# ==================
# Startup
# ==================
after-login-command = []

# sync_top_gap.sh used to compute outer.top from SketchyBar's height.
# SketchyBar is off (service stopped, LaunchAgent removed), so there's no
# bar to work around and nothing to sync. outer.top is hardcoded below,
# same value as the other gaps.
after-startup-command = []

start-at-login = true


# ==================
# Core behavior
# ==================
# Tree normalization: THIS is what lays windows out on its own.
#   flatten-containers          drops single-child containers, which
#                               otherwise pile up and freeze the layout
#   opposite-orientation…       a nested container takes the opposite
#                               orientation of its parent -> real tiling
#                               instead of everything in one direction
# Both were false (AeroSpace defaults are true): the tree went bad as
# windows opened and nothing placed itself anymore.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Pointer follows the focused window. "lazy" = it only moves if it's
# not already inside the window, so no random jumps when you're on the
# mouse. Saves hunting for the pointer after a keyboard switch.
on-focus-changed = ['move-mouse window-lazy-center']

# Script run on every workspace change (refreshes sketchybar, plus
# whatever you want to add). Safe: does nothing if the script is
# missing.
exec-on-workspace-change = [
  '/bin/bash', '-c',
  '~/.config/aerospace/scripts/on_workspace_change.sh "$AEROSPACE_FOCUSED_WORKSPACE" "$AEROSPACE_PREV_WORKSPACE" 2>/dev/null || true',
]

automatically-unhide-macos-hidden-apps = true
key-mapping.preset = 'qwerty'

# ══════════════════════════════════════════════════════════════════════
#  Pin workspaces to monitors
#  With one screen everything lands on it: these rules only kick in
#  when a second one is plugged in. Heavy work stays on the ultrawide,
#  monitoring and fun stuff go to the MacBook screen.
# ══════════════════════════════════════════════════════════════════════
[workspace-to-monitor-force-assignment]
'01_Main'       = 'main'
'02_Coding'     = 'main'
'03_Work'       = ['secondary', 'built-in']
'04_Management' = 'main'
'05_I.A'        = 'main'
'06_Web'        = 'main'
'07_System'     = ['secondary', 'built-in']
'08_Ops'        = 'main'
'09_Divers'     = ['secondary', 'built-in']


# ==================
# Gaps (FelixKratz-inspired)
# ==================
[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.right = 12
outer.top = 12       # same as the other gaps. macOS already reserves the
                     # menu bar: AeroSpace puts windows below it, this value
                     # only adds to the visible area.
outer.bottom = 12

# ==================
# Main mode bindings
# ==================
[mode.main.binding]

# Hyper = cmd + alt + ctrl + shift

# --- Focus (vim) ---
# cmd-alt-ctrl-shift-h = 'focus left'
cmd-alt-ctrl-shift-j = 'focus left'
cmd-alt-ctrl-shift-k = 'focus down'
cmd-alt-ctrl-shift-l = 'focus right'
cmd-alt-ctrl-shift-i = 'focus up'

# --- Focus (IJKL cluster, no Shift) ---
cmd-alt-ctrl-i = 'focus up'
cmd-alt-ctrl-j = 'focus left'
cmd-alt-ctrl-k = 'focus down'
cmd-alt-ctrl-l = 'focus right'
# cmd-alt-i/j/k/l removed: fully redundant with the two blocks above
# (cmd-alt-ctrl-* and Hyper), and they were the only bindings without
# ctrl, so the only ones clashing with app shortcuts.

# --- Focus (arrows) ---
cmd-alt-ctrl-shift-left = 'focus left'
cmd-alt-ctrl-shift-down = 'focus down'
cmd-alt-ctrl-shift-up = 'focus up'
cmd-alt-ctrl-shift-right = 'focus right'

# --- Move windows (SEDF) ---
cmd-alt-ctrl-shift-s = 'move left'
cmd-alt-ctrl-shift-e = 'move up'
cmd-alt-ctrl-shift-d = 'move down'
cmd-alt-ctrl-shift-f = 'move right'

# --- Layout ---
cmd-alt-ctrl-shift-space = 'layout tiles accordion'
cmd-alt-ctrl-shift-enter = 'layout floating tiling'

# --- Fullscreen ---
cmd-alt-ctrl-shift-t = 'fullscreen'
cmd-alt-ctrl-shift-g = 'macos-native-fullscreen'

# --- Modes ---
cmd-alt-ctrl-shift-r = 'mode resize'
cmd-alt-ctrl-shift-a = 'mode layout'   # t/a/f/h/v/s/g/b/r then esc

# --- Quick resize presets ---
cmd-alt-ctrl-shift-y = 'balance-sizes'
cmd-alt-ctrl-shift-u = ['balance-sizes', 'exec-and-forget ~/.config/aerospace/scripts/resize_thirds.sh one-third']
cmd-alt-ctrl-shift-o = ['balance-sizes', 'exec-and-forget ~/.config/aerospace/scripts/resize_thirds.sh two-thirds']

# --- Workspace switching (numeric) ---
cmd-alt-ctrl-shift-1 = 'workspace 01_Main'
cmd-alt-ctrl-shift-2 = 'workspace 02_Coding'
cmd-alt-ctrl-shift-3 = 'workspace 03_Work'
cmd-alt-ctrl-shift-4 = 'workspace 04_Management'
cmd-alt-ctrl-shift-5 = 'workspace 05_I.A'
cmd-alt-ctrl-shift-6 = 'workspace 06_Web'
cmd-alt-ctrl-shift-7 = 'workspace 07_System'
cmd-alt-ctrl-shift-8 = 'workspace 08_Ops'
cmd-alt-ctrl-shift-9 = 'workspace 09_Divers'
cmd-alt-ctrl-shift-0 = 'workspace 01_Main'

# --- Send window to workspace (mode) ---
cmd-alt-ctrl-shift-n = 'mode workspace'

# --- Back and forth ---
cmd-alt-ctrl-shift-b = 'workspace-back-and-forth'

# --- Move workspace to another monitor ---
cmd-alt-ctrl-shift-m = 'move-workspace-to-monitor --wrap-around next'

# --- Service mode ---
cmd-alt-ctrl-shift-semicolon = 'mode service'
cmd-alt-ctrl-shift-x = 'mode service'

# --- App switcher (works across native fullscreen spaces) ---
cmd-tab = 'exec-and-forget ~/.config/workflow-tools/appswitcher next'
cmd-shift-tab = 'exec-and-forget ~/.config/workflow-tools/appswitcher prev'
cmd-alt-tab = 'exec-and-forget ~/.config/workflow-tools/appswitcher next'
cmd-alt-shift-tab = 'exec-and-forget ~/.config/workflow-tools/appswitcher prev'


# ==================
# Layout mode  (Hyper+A)  (no need to remember 3 Hyper combos)
# ==================
[mode.layout.binding]
t = ['layout tiles horizontal vertical', 'mode main']   # tiles
a = ['layout accordion horizontal vertical', 'mode main']
f = ['layout floating tiling', 'mode main']             # toggle floating
h = ['layout tiles horizontal', 'mode main']            # force horizontal
v = ['layout tiles vertical', 'mode main']              # force vertical
s = ['fullscreen', 'mode main']                         # fullscreen (space)
g = ['macos-native-fullscreen', 'mode main']
b = ['balance-sizes', 'mode main']
r = ['flatten-workspace-tree', 'mode main']             # flatten

esc = 'mode main'
enter = 'mode main'

# ==================
# Resize mode
# ==================
[mode.resize.binding]

i = 'resize height -50'
j = 'resize width -50'
k = 'resize height +50'
l = 'resize width +50'
1 = ['balance-sizes', 'exec-and-forget ~/.config/aerospace/scripts/resize_thirds.sh one-third']
2 = ['balance-sizes', 'exec-and-forget ~/.config/aerospace/scripts/resize_thirds.sh two-thirds']
b = 'balance-sizes'

esc = 'mode main'
enter = 'mode main'


# ==================
# Workspace send mode
# ==================
[mode.workspace.binding]

1 = ['move-node-to-workspace 01_Main', 'workspace 01_Main', 'mode main']
2 = ['move-node-to-workspace 02_Coding', 'workspace 02_Coding', 'mode main']
3 = ['move-node-to-workspace 03_Work', 'workspace 03_Work', 'mode main']
4 = ['move-node-to-workspace 04_Management', 'workspace 04_Management', 'mode main']
5 = ['move-node-to-workspace 05_I.A', 'workspace 05_I.A', 'mode main']
6 = ['move-node-to-workspace 06_Web', 'workspace 06_Web', 'mode main']
7 = ['move-node-to-workspace 07_System', 'workspace 07_System', 'mode main']
8 = ['move-node-to-workspace 08_Ops', 'workspace 08_Ops', 'mode main']
9 = ['move-node-to-workspace 09_Divers', 'workspace 09_Divers', 'mode main']
0 = ['move-node-to-workspace 01_Main', 'workspace 01_Main', 'mode main']

esc = 'mode main'
enter = 'mode main'


# ==================
# Service mode
# ==================
[mode.service.binding]

esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
q = ['close', 'mode main']


# ══════════════════════════════════════════════════════════════════════
#  Rules when a window opens
#
#  Design choice: we do NOT route the terminal or the editor.
#  An Alacritty or Emacs window should open where you're working,
#  not jump somewhere else (that was the point of the old comment
#  "keep new windows on the current workspace").
#  We only route "destination" apps (browser, chat, media, ops) and
#  float the utilities, where the win is obvious.
# ══════════════════════════════════════════════════════════════════════

# ── Utilities: floating, never tiled ──────────────────────────────────
# Launchers, clipboard managers, HUDs, screenshots: tiling them makes no
# sense and wrecks the layout every time they pop up.
[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'org.p0deje.Maccy'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'cc.ffitch.shottr'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.dwarvesv.minimal-numi'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'pro.betterdisplay.BetterDisplay'
run = ['layout floating']

# ── Finder: the DESKTOP floats, folder windows tile ───────────────────
#
# Two kinds of Finder windows have no business in the tiling:
#
#   Desktop / Bureau   macOS exposes the desktop as a full Finder
#                      window. Tiled, it takes a slot for nothing:
#                      Finder looks like it takes two spots.
#   Copy / Copie       the copy progress window. It pops up, shoves
#                      everything around, then goes away.
#
# The ^...$ anchor avoids catching a folder whose name CONTAINS these
# words. A folder named exactly "Copy" would still float. That's the
# only possible false positive, and it's harmless.
#
# The desktop's window-id keeps changing (macOS recreates it), so
# handling it by hand is pointless: only an on-detect rule sticks.
#
# Checked: `aerospace list-windows --all` shows it next to the real
# folder windows. A first check missed it, which made me wrongly
# conclude there was nothing to protect.
[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = '^(Desktop|Bureau|Copy|Copie|Move|Deplacement|Déplacement)$'
run = ['layout floating']

# FOLDER windows, on the other hand, are not in the floating list above,
# on purpose. Finder used to be there by mistake: the entries above are
# SHORT-LIVED windows (launcher, clipboard, screenshot, HUD) that pop up
# and go away. Finder is a window you WORK in, tiling it makes exactly
# as much sense as tiling a terminal.
#
# Checked before changing: `aerospace list-windows --all` only reports
# one Finder window (the open folder). The desktop isn't counted as a
# window, so nothing to protect here.
#
# Finder's Open/Save dialogs stay floating: the title rule right below
# covers them, and it applies to every app.

# Dialogs (Open/Save): always floating
[[on-window-detected]]
if.window-title-regex-substring = '^(Open|Save|Enregistrer|Ouvrir|Preferences|Reglages)'
run = ['layout floating']
check-further-callbacks = true

# ── 06_Web: browsers ──────────────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = ['move-node-to-workspace 06_Web']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace 06_Web']

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = ['move-node-to-workspace 06_Web']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace 06_Web']

# ── 05_I.A: assistants ────────────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = ['move-node-to-workspace 05_I.A']

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = ['move-node-to-workspace 05_I.A']

[[on-window-detected]]
if.app-id = 'ai.perplexity.mac'
run = ['move-node-to-workspace 05_I.A']

# ── 03_Work: communication ────────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.mimestream.Mimestream'
run = ['move-node-to-workspace 03_Work']

[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = ['move-node-to-workspace 03_Work']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace 03_Work']

# ── 04_Management: notes & planning ───────────────────────────────────
[[on-window-detected]]
if.app-id = 'notion.id'
run = ['move-node-to-workspace 04_Management']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 04_Management']

[[on-window-detected]]
if.app-id = 'com.clickup.desktop-app'
run = ['move-node-to-workspace 04_Management']

# ── 08_Ops: infra & databases ─────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.docker.docker'
run = ['move-node-to-workspace 08_Ops']

[[on-window-detected]]
if.app-id = 'com.postmanlabs.mac'
run = ['move-node-to-workspace 08_Ops']

[[on-window-detected]]
if.app-id = 'org.jkiss.dbeaver.core.product'
run = ['move-node-to-workspace 08_Ops']

# ── 09_Divers: media ──────────────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace 09_Divers']

[[on-window-detected]]
