# ~/.config/herdr/config.toml
# Recharger : herdr server reload-config   (ou prefix+shift+r)

onboarding = false

# ─────────────────────────────────────────────────────────────
# Thème — minimal, quasi monochrome, un seul accent chaud
# ─────────────────────────────────────────────────────────────
[theme]
name = "vesper"
auto_switch = false

[theme.custom]
# Transparence : les panneaux herdr héritent du fond du terminal
panel_bg = "reset"
# Meme raison, pour la sidebar. Elle etait restee au noir opaque de vesper :
# a opacity = 0.55 cote Alacritty, ca faisait une bande opaque collee contre
# un terminal translucide. `herdr config check` accepte "reset" ici, mais la
# doc n'associe explicitement "reset" qu'a panel_bg — si le rendu ne suit pas,
# remettre une valeur hex (vesper : "#101010").
sidebar_bg = "reset"
accent = "#ffc799"

# ── Sélection dans la sidebar ────────────────────────────────────────
# Le fond de la ligne sélectionnée était un noir franc, qui se découpait
# durement sur le fond du terminal (#101216). Ces deux valeurs sont
# posées JUSTE au-dessus de ce fond : la sélection se lit encore, mais
# comme un voile, plus comme un bloc.
#
#   active_row_bg  la ligne du space/agent courant
#   selection_bg   la ligne survolée au clavier dans les sélecteurs
#
# Note : herdr ne sait pas arrondir les angles d'une ligne de sidebar.
# Ce n'est pas une boîte dessinée mais un fond de ligne — il n'y a ni
# bordure ni rayon à régler. Les seuls angles arrondis de l'interface
# sont ceux des bordures de panes.
active_row_bg = "#181c24"
selection_bg  = "#222833"

# ── Jetons de couleur non documentes ─────────────────────────────────
# `herdr --default-config` n'en documente que 7. Le binaire en accepte 11 :
#   sidebar_bg  active_row_bg  selection_bg  surface_dim  panel_bg
#   accent  mauve  green  yellow  red  peach
# surface_dim / mauve / yellow / peach n'apparaissent dans aucune doc.
#
# Ces trois couleurs portent les etats d'agent et le statut git. Depuis que
# status_indicators = "symbols" (voir [ui]), la FORME porte l'etat : la
# couleur n'est plus qu'un renfort, elle peut donc etre calmee sans rien
# perdre. Une seule exception, `red` : c'est le « agis maintenant », il reste
# a pleine intensite (valeur d'origine de vesper).
#
# Hierarchie voulue :  red vif  >  yellow tiede  >  green calme
# `green` (agent termine = ignorable) est volontairement le plus discret ;
# le mint d'origine de vesper (#99ffe4) criait plus fort que l'urgence.
red    = "#ff8080"   # bloque / erreur    — vesper d'origine, non touche
yellow = "#ffc16b"   # en cours           — remonte le 27/08 (plus de couleur)
green  = "#8ee6cb"   # termine / propre   — remonte le 27/08 (plus de couleur)
peach  = "#ffc799"   # aligne sur accent
mauve  = "#b9a5d6"
# Surface intermediaire : un cran au-dessus du fond du terminal (#101216),
# un cran en dessous de active_row_bg (#181c24).
surface_dim = "#15181e"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

# ─────────────────────────────────────────────────────────────
# UI — moins de chrome, plus de contenu
# ─────────────────────────────────────────────────────────────
[ui]
accent = "#ffc799"

# Terminal mesure : 155 colonnes. A 28, la sidebar n'en prenait que 18 % et
# tronquait tout au-dela de ~26 caracteres — d'ou l'impossibilite de lire le
# sujet d'un agent. A 40, elle prend 26 % et laisse ~113 colonnes au contenu,
# ce qui reste large pour du code ou un TUI. `prefix+b` la replie a la demande.
#
# Le « 36 » de la doc herdr n'est PAS un plafond, seulement le maximum par
# defaut : le binaire accepte au moins 96. min reste a 22 pour que la config
# tienne encore sur un ecran etroit ou en --remote.
sidebar_width = 40
sidebar_min_width = 22
# 36 = le maximum par defaut de herdr. La largeur s'auto-ajuste aux libelles :
# relever le plafond ne coute rien tant que les noms sont courts, et evite la
# troncature sur « mon-garage-auto ». Meme probleme que le prefixe « project: »
# du navigator, traite par l'autre bout.
sidebar_max_width = 52
sidebar_collapsed_mode = "compact"
# Explicite : aucun interet sur un 3840x1600, et la sidebar est justement ce
# qui porte l'etat des agents. `prefix+b` (toggle_sidebar, defaut herdr) la
# replie a la demande. Passer a true si tu travailles un jour sur petit ecran.
sidebar_start_collapsed = false

pane_borders = true
# Supprime le cadre qui entoure L'ENSEMBLE de la zone de panes, en gardant les
# separateurs internes (style tmux). Suite logique de pane_scrollbars = false
# et hide_tab_bar_when_single_tab : ce cadre est redondant avec le bord du
# terminal et la sidebar.
pane_outer_borders = false
pane_gaps = true
pane_scrollbars = false              # récupère une colonne, moins de bruit visuel
hide_tab_bar_when_single_tab = true  # pas de barre d'onglets inutile
tab_bar_position = "top"
show_agent_labels_on_pane_borders = true

# ══════════════════════════════════════════════════════════════════════
#  status_indicators — la forme plutot que la teinte
#
#  "dots" (defaut) encode l'etat UNIQUEMENT par la couleur. Or ce setup
#  empile trois choses qui degradent chacune la discrimination des teintes :
#  un theme quasi monochrome, opacity = 0.55, et blur = true.
#
#  "symbols" donne un glyphe distinct par etat (blocked / working / done /
#  idle / unknown). La forme porte l'information, la couleur ne fait plus
#  que la renforcer — cf. le bloc `red`/`yellow`/`green` dans [theme.custom].
# ══════════════════════════════════════════════════════════════════════
status_indicators = "symbols"

# "spaces" reste le bon choix a 1-2 agents : le regroupement par projet prime.
# A basculer sur "priority" (file d'attente par urgence, ce qui te bloque
# remonte en tete) le jour ou plusieurs agents tournent en parallele : avec
# 4 lignes par agent, 6 agents = 24 lignes et le groupement devient illisible.
agent_panel_sort = "spaces"
prompt_new_tab_name = false          # les onglets se nomment tout seuls (cf. plugin rename)
prompt_new_workspace_name = false
confirm_close = true

# ── Titre ecrit dans le terminal hote ────────────────────────────────
# Defaut : "{hostname}: {workspace}". {hostname} est du bruit en local — c'est
# cette machine. sketchybar n'affiche que front_app, donc ce titre ne sert qu'a
# Mission Control et au selecteur d'applications ; {terminal_title} y fait
# apparaitre la tache en cours de l'agent. Alacritty a dynamic_title = true,
# c'est ce qui le rend visible.
# Remettre {hostname} si tu utilises `herdr --remote`.
# Jetons : {hostname} {workspace} {tab} {pane} {terminal_title}
window_title = "{workspace} · {terminal_title}"

# ══════════════════════════════════════════════════════════════════════
#  Barre de statut (bord droit de la barre d'onglets)
#
#  Syntaxe non documentee : c'est un enum INTERNALLY TAGGED, donc `type =`
#  est obligatoire et la forme chaine ("zoom") est refusee.
#    { type = "zoom" }
#    { type = "hostname" }
#    { type = "datetime", format = "%H:%M" }
#    { type = "text",     text = "..." }
#    { type = "command",  command = "...", interval_seconds = 30,
#                         timeout_seconds = 2 }
#  Les entrees command/hostname/datetime sont resolues par le SERVEUR herdr.
#  Le binaire contient un message « ui.tab_bar_right may contain at most N »
#  applique a l'execution, que `config check` ne signale pas (il accepte
#  16 entrees sans broncher) — rester a 3 ou 4.
#
#  ⚠ LIMITE CONNUE : hide_tab_bar_when_single_tab = true (plus bas) masque
#  la barre d'onglets quand le space n'a qu'UN onglet — et donc cette zone
#  avec. Or un space a un seul onglet peut avoir plusieurs panes, ce qui est
#  exactement le cas ou l'on zoome. L'indicateur ne sera donc visible qu'a
#  partir de deux onglets. Pour l'avoir toujours : passer
#  hide_tab_bar_when_single_tab a false (coute une ligne en permanence).
#
#  `zoom` signale qu'un pane est zoome (prefix+z). Sans lui, rien ne le dit :
#  il faut deduire le zoom de l'absence des autres panes.
tab_bar_right = [
  { type = "zoom" },
]
tab_bar_right_separator = "   "

mouse_capture = true
copy_on_select = true
mouse_scroll_lines = 3

# Lignes de la sidebar : compactes, 2 lignes max, zéro respiration inutile
# Jetons integres pour les spaces :
#   state_icon  state_text  workspace  branch  git_status
# Les jetons en $ viennent des METADONNEES DE WORKSPACE, publiees par
# `herdr workspace report-metadata <id> --source X --token NOM=VALEUR`.
# C'est le pendant, cote space, de ce que usagebar fait cote pane.
#
#   $sync   ecart avec le remote, alimente par workflow-tools/herdr-space-metadata
#           ↑2 = 2 commits d'avance   ↓1 = 1 de retard   ⚑3 = 3 stashes
#
# Volontairement complementaire de `git_status`, qui montre l'etat de l'arbre
# de travail (modifie / en attente) : $sync montre l'ecart avec l'amont, que
# rien n'affichait.
#
# NON VERIFIE : herdr ne documente pas s'il masque une ligne dont tous les
# jetons sont vides, ou s'il laisse une ligne blanche. Si les spaces propres
# gagnent une ligne vide dans la sidebar, remettre $sync sur la 2e ligne :
#   ["branch", "git_status", { token = "$sync", dim = true }]
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$sync", dim = true }],
]

# ══════════════════════════════════════════════════════════════════════
#  Panneau AGENTS
#
#  Historique : le defaut herdr mettait ["state_icon","workspace","tab"] sur
#  UNE ligne — trois informations dans 24 colonnes, donc tout tronque. La
#  version suivante a eclate ca sur 4 lignes, ce qui reglait la troncature
#  mais laissait un defaut de HIERARCHIE : la ligne en gras portait le titre
#  de tache, c'est-a-dire l'information la PLUS volatile (elle change a
#  chaque tour d'agent), et l'identite du projet lui etait subordonnee.
#
#  Regle appliquee ici : ce qui est STABLE ancre l'entree, ce qui est
#  VOLATILE vient apres, ce qui est CHIFFRE finit en sourdine.
#
#    ligne 1   etat + QUEL PROJET     ◐ mon-garage-auto   (gras + accent)
#    ligne 2   ce qu'il fait          Corne keyboard direction…
#    ligne 3   qui, et ou             claude  run
#    ligne 4   ce qu'il consomme      ⛁ 19% (186k)  5h 82%
#    (ligne vide : row_gap = 1)
#
#  row_gap = 1 : c'est le SEUL separateur disponible entre deux agents.
#  Sans lui, deux entrees de 4 lignes se touchent et forment un mur.
#
#  Ce qui n'est PAS faisable, et pourquoi il n'y a ni indentation ni « · » :
#  herdr refuse tout texte litteral dans une ligne — « unknown sidebar token;
#  custom tokens must start with $ ». Et un jeton $ ne contenant que des
#  espaces est silencieusement jete (teste : il n'est meme pas stocke). Les
#  lignes 2 a 4 sont donc a fleur de marge.
#
#  Jetons integres pour les agents :
#    state_icon  state_text  workspace  tab  pane  agent
#    terminal_title  terminal_title_stripped
#
#  Les jetons en $ viennent des METADONNEES DE PANE (`herdr pane
#  report-metadata`). Ceux-ci viennent d'usagebar :
#    $context   contexte consomme par le pane      ⛁ 19% (186k)
#    $limit     fenetre de quota la plus courte     5h 82%
#    $provider  le backend qui repond               anthropic, ollama…
#    $title     le titre du terminal, deja nettoye
#
#  Mis a jour quand l'agent s'est POSE (pas pendant qu'il travaille) : les
#  chiffres correspondent donc toujours au dernier tour termine.
#
#  Style en ligne : { token = "x", fg = "#RRGGBB", bold = true, dim = true }
#  Seuls #RGB / #RRGGBB sont acceptes — pas de noms de couleur ici.
#
#  La surcharge par agent a ete retiree : elle n'existait que pour remonter
#  terminal_title_stripped en ligne 1 chez claude. Cette ligne porte
#  desormais le projet pour TOUS les agents, et le titre est en ligne 2 pour
#  tout le monde — la surcharge n'avait plus d'objet.
# ══════════════════════════════════════════════════════════════════════
# ── Couleurs ─────────────────────────────────────────────────────────
# La version precedente mettait dim = true sur les lignes 2 a 4 : dim
# ecrase la teinte, donc TOUT sortait en gris et seul le libelle du space
# gardait une couleur. Ici chaque ligne porte une teinte explicite, et
# dim = false est pose FRANCHEMENT — la doc herdr precise qu'un champ de
# style omis « preserve the contextual default », donc ne pas l'ecrire
# aurait laisse le dim revenir par la bande.
#
# Une couleur par NATURE d'information, pas une couleur par ligne :
#   identite   projet         peach   #ffc799  l'accent, en gras
#   activite   ce qu'il fait  mauve   #c4a7e7
#   qui/ou     agent          teal    #7fd9c4
#              onglet         ardoise #8aa0b8  volontairement en retrait
#   budget     consomme       ambre   #e0b070  ce qui est brule (chaud)
#              restant        sauge   #8fbf9f  ce qui reste (froid)
#
# Le couple ambre/sauge n'est pas decoratif : chaud = ce qui part, froid =
# ce qui reste. On lit le rapport des deux sans lire les chiffres.
#
# fg accepte n'importe quel #RRGGBB, pas seulement les jetons du theme.
# En revanche il n'y a PAS de fond : seul le premier plan est stylable.
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", bold = true, fg = "#ffc799", dim = false }],
  [{ token = "terminal_title_stripped", fg = "#c4a7e7", dim = false }],
  [{ token = "agent", fg = "#7fd9c4", dim = false }, { token = "tab", fg = "#8aa0b8", dim = false }],
  [{ token = "$context", fg = "#e0b070", dim = false }, { token = "$limit", fg = "#8fbf9f", dim = false }],
]

# ─────────────────────────────────────────────────────────────
# Notifications — l'intérêt principal de herdr : savoir quel agent t'attend
# ─────────────────────────────────────────────────────────────
[ui.toast]
delivery = "system"                  # notif macOS native ; "terminal" ou "herdr" si tu préfères
delay_seconds = 2

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

# ── Sons par agent ───────────────────────────────────────────────────
# Valeurs : "default" | "on" | "off". Les sons ne se declenchent que pour les
# spaces EN ARRIERE-PLAN — c'est deja le comportement voulu, donc `claude` est
# laisse sur "default" : la cle est posee pour etre trouvable, pas pour changer
# quoi que ce soit aujourd'hui. Passer un agent a "off" le rend muet (c'est
# deja le cas de `droid` par defaut chez herdr).
#
# Ids d'agents reconnus par le binaire :
#   pi  claude  codex  gemini  cursor  devin  cline  opencode  copilot
#   kimi  kiro  droid  amp  grok  hermes  kilo  qodercli  qwen  maki
[ui.sound.agents]
claude = "default"

[session]
resume_agents_on_restore = true      # reprend les conversations après restart du serveur

[worktrees]
directory = "~/.herdr/worktrees"

# ─────────────────────────────────────────────────────────────
# Keybindings
# ─────────────────────────────────────────────────────────────
[keys]
prefix = "ctrl+b"

switch_tab = "prefix+1..9"

# Splits facon nvim (:sp / :vs) — s dessous, v a cote
split_horizontal = "prefix+s"
split_vertical   = "prefix+v"

# ══════════════════════════════════════════════════════════════════════
#  Navigation SANS MAJUSCULE
#
#  Probleme corrige : par defaut herdr met `next_tab` sur prefix+n et
#  `new_workspace` sur prefix+shift+n. Deux actions tres differentes sur
#  la meme lettre, dont une qui exige Shift.
#
#  Nouveau schema, tout en minuscules :
#    n         nouveau space      c       nouveau tab
#    [  ]      space prec/suiv    ,  .    tab prec/suiv
#    /         renommer space     ;       renommer tab
#    '         fermer space       x       fermer pane
#    h j k l   focus entre panes  1..9    aller au tab N
# ══════════════════════════════════════════════════════════════════════

# ── Spaces ────────────────────────────────────────────────────────────
# w et g echanges par rapport aux defauts herdr :
#   g = go to space  (etait le picker sur w)
#   w = goto         (etait sur g)
workspace_picker   = "prefix+g"
goto               = "prefix+shift+w"   # w minuscule est passe au navigator (plus bas)

new_workspace      = "prefix+n"      # n = new  (etait next_tab)
rename_workspace   = "prefix+/"      # etait prefix+shift+w
close_workspace    = "prefix+'"      # etait prefix+shift+d
previous_workspace = "prefix+["      # sequentiel, sans picker
next_workspace     = "prefix+]"

# ── Tabs ──────────────────────────────────────────────────────────────
new_tab      = "prefix+c"            # c = create (defaut, inchange)
previous_tab = "prefix+,"            # < et > sur les memes touches
next_tab     = "prefix+."
rename_tab   = "prefix+;"            # etait prefix+shift+t

# ── Agents : meme logique que les tabs, un cran plus loin ────────────
# (prefix+9/0 impossible : switch_tab occupe prefix+1..9)
previous_agent = "prefix+alt+,"
next_agent     = "prefix+alt+."

# ══════════════════════════════════════════════════════════════════════
#  Panes — DEUX schemas, un par reflexe. Aucun Shift.
#
#  1. prefix + i/j/k/l  =  exactement AeroSpace (Hyper i/j/k/l).
#     Meme cluster, meme sens : i haut, j gauche, k bas, l droite.
#     Le geste est identique, seul le modificateur change.
#
#  2. alt + h/j/k/l     =  exactement nvim, SANS prefix.
#     Traverse les panes herdr ET les splits Neovim de facon continue
#     (plugin vim-herdr-navigation). C'est le schema de tous les jours.
# ══════════════════════════════════════════════════════════════════════
focus_pane_up    = "prefix+i"
focus_pane_left  = "prefix+j"
focus_pane_down  = "prefix+k"
focus_pane_right = "prefix+l"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"      # saute direct sur l'agent n°N
last_pane = "prefix+backtick"        # aller-retour entre deux panes

# ══════════════════════════════════════════════════════════════════════
#  DEPLACER un pane (et non deplacer le focus)
#
#  Il manquait la moitie du geste : deux schemas pour bouger le FOCUS
#  (prefix+ijkl facon AeroSpace, alt+hjkl facon nvim) et aucun pour bouger
#  le PANE lui-meme.
#
#  AeroSpace met `move` sur Hyper+SEDF — impossible ici, prefix+s est
#  split_horizontal. Le choix retenu est donc le meme cluster que le focus,
#  plus Shift. Ca deroge au principe « sans majuscule » de ce fichier, et
#  c'est assume : rearranger un pane est rare, naviguer ne l'est pas.
#
#  Verifie : herdr normalise `prefix+shift+i` et `prefix+I` sur la MEME
#  touche, et Alacritty envoie bien « I » pour shift+i. Le binding declenche.
# [SUSPENDU 2026-08-27] swap_pane_up    = "prefix+shift+i"
# [SUSPENDU 2026-08-27] swap_pane_left  = "prefix+shift+j"
# [SUSPENDU 2026-08-27] swap_pane_down  = "prefix+shift+k"
# [SUSPENDU 2026-08-27] swap_pane_right = "prefix+shift+l"

# ── Reordonner les onglets ───────────────────────────────────────────
#  prefix+, / prefix+. changent d'onglet ; < et > le POUSSENT.
#
#  ⚠ Ecrit « prefix+< » et non « prefix+shift+, » : ce sont deux touches
#  DIFFERENTES pour herdr (verifie par collision — shift+, et shift+comma
#  entrent en conflit entre elles, mais pas avec <). herdr n'implemente le
#  protocole clavier kitty que cote pane (src/pane/kitty_keyboard.rs), pas
#  cote client : Alacritty lui envoie donc le caractere « < », pas
#  « shift+virgule ». Ecrit autrement, ce binding ne declencherait jamais.
# [SUSPENDU 2026-08-27] move_tab_previous = "prefix+<"
# [SUSPENDU 2026-08-27] move_tab_next     = "prefix+>"

# Defaut herdr, rendu explicite parce qu'il est trop utile pour rester cache :
# ouvre TOUT le scrollback du pane dans $EDITOR. Pour relire 2000 lignes de
# sortie d'agent, c'est superieur au copy-mode — on y arrive avec la recherche,
# les text objects tree-sitter et les marks de Doom.
# [SUSPENDU 2026-08-27] edit_scrollback = "prefix+e"

# Mode navigate : mouvements locaux facon vim
navigate_pane_left  = "h"
navigate_pane_down  = "j"
navigate_pane_up    = "k"
navigate_pane_right = "l"

# Popups outils — s'ouvrent au-dessus, se ferment à la sortie du process
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+d"
type = "popup"
command = "lazydocker"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+b"
type = "popup"
command = "btop"
width = "90%"
height = "90%"

# alt+k = kill — chercher un process par son nom et le tuer.
# btop (alt+b) sait aussi tuer, mais c'est un moniteur : on y arrive pour
# regarder. pk fait l'inverse — on y arrive pour agir, et la recherche
# floue porte sur le nom ET la ligne de commande complete.
[[keys.command]]
key = "prefix+alt+k"
type = "popup"
command = "pk"
width = "92%"
height = "88%"

# alt+e = edit — renommer ou supprimer un space / une session.
# Chemin garanti : un popup a un vrai terminal, donc fzf et gum y sont
# chez eux. Les memes actions existent dans le navigator (prefix+w,
# Ctrl-N) ; la, elles s'executent dans le pane du picker.
[[keys.command]]
key = "prefix+alt+e"
type = "popup"
command = "herdr-manage"
width = "70%"
height = "60%"

# alt+f = floating — un shell d'appoint qui flotte au-dessus du travail,
# un par space, et qui garde son etat entre deux ouvertures. C'est le
# geste « j'ai une commande a taper » sans casser la disposition en cours.
[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "shell flottant (floax)"

# alt+m = markdown — parcourir ~/.config/docs en Markdown rendu.
# `mdv` est le wrapper autour de glow : dans glow 3.0.0 le fichier de
# config et GLAMOUR_STYLE sont ignores, seul le drapeau -s l'est.
[[keys.command]]
key = "prefix+alt+m"
type = "popup"
command = "mdv ~/.config/docs"
width = "88%"
height = "86%"

# ── Actions de plugins ────────────────────────────────────────

# vim-herdr-navigation : alt+h/j/k/l traverse panes herdr ET splits nvim.
# PAS ctrl+h/j/k/l : herdr capte ces touches SANS prefix, donc
#   ctrl+l n'atteignait plus le shell (clear-screen)
#   ctrl+h n'atteignait plus tmux (mode HELP) — et c'est aussi backspace
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# a = actions — palette fzf de TOUT ce qui est bindable
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "jt.command-palette.open"
description = "command palette"

# f = files — explorateur git-aware en split
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "file viewer (split)"

# d = diff — review du travail de l'agent
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr (toggle)"

# w = where — le navigator, jump fuzzy vers space / agent / projet / session.
# C'est le point d'entree universel : quand on ne sait pas ou est la chose, w.
# (prefix+i sert au focus pane vers le HAUT comme AeroSpace ; goto est passe
#  sur prefix+shift+w.)
[[keys.command]]
key = "prefix+w"
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator"

# alt+w = le meme, en pane lateral au lieu du plein ecran
[[keys.command]]
key = "prefix+alt+w"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "navigator (pane lateral)"

# alt+i = revenir d'ou l'on vient apres un saut du navigator
[[keys.command]]
key = "prefix+alt+i"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "navigator: revenir en arriere"

# m = memex — recherche dans les transcripts d'agents
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "nicosuave.memex.palette"
description = "memex (sessions)"

# t / u = termscope — ouvrir un fichier / un lien visible à l'écran
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "termscope.open"
description = "termscope: fichiers visibles"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "termscope.open-links"
description = "termscope: liens visibles"

# h = home — le space hors-projet : depots, systeme, fichiers, mises a jour.
# Template : projects/00-quotidien.toml.
#
# Passe par herdr-open-project et non par `herdr-plus open` directement :
# ce dernier cree TOUJOURS un nouveau space (workspaceCreate), donc appuyer
# deux fois donnait deux "quotidien". Le script focalise l'existant.
#
# Chemin absolu : un binding `type = "shell"` tourne detache et n'herite pas
# forcement du PATH du shell de login.
[[keys.command]]
key = "prefix+h"
type = "shell"
command = "/Users/youcef/.config/workflow-tools/herdr-open-project quotidien"
description = "space quotidien (hors projet)"

# p = projects — monte tout le workspace d'un projet (tabs + commandes).
# prefix+p etait libre : le defaut herdr y mettait `previous_tab`, deplace
# sur prefix+, plus haut. La lettre colle au mot, et c'est un accord de moins
# que l'ancien prefix+alt+o.
#
# Deux chemins vers les projets, volontairement :
#   prefix+p         picker dedie, groupe par `group` (python / node / systeme)
#   prefix+w Ctrl+P  filtre `project` dans le navigator, a cote des spaces
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

# alt+a = quick Actions — lanceur flou, dans le repertoire courant
[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

# ══════════════════════════════════════════════════════════════════════
#  Plugins ajoutes le 2026-08-20
#  Schema mnemonique : la lettre = le mot. Majuscule = variante/gestion.
# ══════════════════════════════════════════════════════════════════════

# alt+v = lazygit en pane lateral (v comme « version control »).
# prefix+g = goto, prefix+shift+g = new_worktree : intouchables.
# prefix+alt+g reste ton popup lazygit existant.
[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "herdr-lazygit.open"
description = "lazygit (pane)"

# alt+z = zoxide (prefix+z est `zoom` chez herdr)
[[keys.command]]
key = "prefix+alt+z"
type = "plugin_action"
command = "herdr-zoxide.browse"
description = "zoxide -> workspace"

# y = yazi — explorateur de fichiers
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "ray.file-explorer.open"
description = "yazi (explorateur)"

# alt+u = usage — jauges de contexte et limites de taux des agents
[[keys.command]]
key = "prefix+alt+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "usage & limites des agents"

# shift+u = la MEME information, recalculee tout de suite. Suit la convention
# de ce fichier : « Majuscule = variante/gestion ». Les compteurs de la sidebar
# ne sont rafraichis que lorsque l'agent s'est POSE (jamais pendant qu'il
# travaille) ; ceci force le recalcul de $context et $limit sans attendre.
# [SUSPENDU 2026-08-27] [[keys.command]]
# [SUSPENDU 2026-08-27] key = "prefix+shift+u"
# [SUSPENDU 2026-08-27] type = "plugin_action"
# [SUSPENDU 2026-08-27] command = "usagebar.refresh"
# [SUSPENDU 2026-08-27] description = "usagebar : recalculer $context / $limit"

# alt+t = tokens — depense en direct (prefix+shift+t = rename_tab chez herdr)
[[keys.command]]
key = "prefix+alt+t"
type = "plugin_action"
command = "dave.token-dashboard.open-dashboard"
description = "dashboard tokens"

# alt+l = llmtrim (prefix+shift+l est deja next_workspace)
[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
command = "llmtrim.proxy.summary"
description = "llmtrim (economie de contexte)"

# alt+p = plugins (prefix+shift+p est rename_pane chez herdr)
[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "gestionnaire de plugins"

# alt+r = retry (prefix+r est resize_mode chez herdr)
[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "claude-auto-retry.status"
description = "claude auto-retry (statut)"

