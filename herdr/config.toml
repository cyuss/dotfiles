# ~/.config/herdr/config.toml
# Reload: herdr server reload-config   (or prefix+shift+r)

onboarding = false

# ─────────────────────────────────────────────────────────────
# Theme: minimal, almost monochrome, one warm accent
# ─────────────────────────────────────────────────────────────
[theme]
name = "vesper"
auto_switch = false

[theme.custom]
# Transparency: herdr panels inherit the terminal background
panel_bg = "reset"
# Same idea for the sidebar. It was stuck on vesper's opaque black, which
# with Alacritty at opacity = 0.55 gave an opaque strip next to a see-through
# terminal. `herdr config check` accepts "reset" here, but the docs only tie
# "reset" to panel_bg. If it renders wrong, go back to a hex value
# (vesper: "#101010").
sidebar_bg = "reset"
accent = "#ffc799"

# ── Sidebar selection ────────────────────────────────────────────────
# The selected row used to be plain black, a hard block on the terminal
# background (#101216). These two sit just above that background: you can
# still see the selection, but as a light veil instead of a block.
#
#   active_row_bg  row of the current space/agent
#   selection_bg   row under the keyboard cursor in pickers
#
# herdr can't round the corners of a sidebar row. It's a row background,
# not a drawn box, so there's no border or radius to set. The only rounded
# corners in the UI are pane borders.
active_row_bg = "#181c24"
selection_bg  = "#222833"

# ── Undocumented color tokens ────────────────────────────────────────
# `herdr --default-config` only lists 7. The binary accepts 11:
#   sidebar_bg  active_row_bg  selection_bg  surface_dim  panel_bg
#   accent  mauve  green  yellow  red  peach
# surface_dim / mauve / yellow / peach aren't in any doc.
#
# These three colors carry agent states and git status. Since
# status_indicators = "symbols" (see [ui]), the shape carries the state and
# color is just a hint, so it can be toned down. One exception, `red`: it
# means "act now", so it stays at full strength (vesper's original).
#
# Intended order:  bright red  >  warm yellow  >  calm green
# `green` (agent done = can ignore) is on purpose the quietest. Vesper's
# original mint (#99ffe4) was louder than the urgent stuff.
red    = "#ff8080"   # blocked / error    — vesper original, untouched
yellow = "#ffc16b"   # working            — bumped 27/08 (more color)
green  = "#8ee6cb"   # done / clean       — bumped 27/08 (more color)
peach  = "#ffc799"   # same as accent
mauve  = "#b9a5d6"
# In-between surface: one step above the terminal background (#101216),
# one step below active_row_bg (#181c24).
surface_dim = "#15181e"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

# ─────────────────────────────────────────────────────────────
# UI: less chrome, more content
# ─────────────────────────────────────────────────────────────
[ui]
accent = "#ffc799"

# Measured terminal: 155 columns. At 28 the sidebar only got 18% and cut
# everything past ~26 chars, so you couldn't read what an agent was on.
# At 40 it takes 26% and leaves ~113 columns, still plenty for code or a TUI.
# `prefix+b` folds it when needed.
#
# The "36" in the herdr docs is NOT a hard cap, just the default max: the
# binary accepts at least 96. min stays at 22 so the config still fits on a
# narrow screen or with --remote.
sidebar_width = 40
sidebar_min_width = 22
# 36 = herdr's default max. The width adapts to the labels, so raising the
# cap costs nothing while names are short, and stops "a-long-project" from
# getting cut. Same problem as the navigator's "project:" prefix, fixed
# from the other end.
sidebar_max_width = 52
sidebar_collapsed_mode = "compact"
# Explicit: no point on a 3840x1600, and the sidebar is what shows agent
# state. `prefix+b` (toggle_sidebar, herdr default) folds it when needed.
# Set to true if you ever work on a small screen.
sidebar_start_collapsed = false

pane_borders = true
# Drops the frame around the WHOLE pane area but keeps the inner separators
# (tmux style). Goes with pane_scrollbars = false and
# hide_tab_bar_when_single_tab: that frame just repeats the terminal edge
# and the sidebar.
pane_outer_borders = false
pane_gaps = true
pane_scrollbars = false              # one more column, less visual noise
hide_tab_bar_when_single_tab = true  # no useless tab bar
tab_bar_position = "top"
show_agent_labels_on_pane_borders = true

# ══════════════════════════════════════════════════════════════════════
#  status_indicators: shape over color
#
#  "dots" (default) shows state with color ONLY. This setup stacks three
#  things that each make colors harder to tell apart: an almost
#  monochrome theme, opacity = 0.55, and blur = true.
#
#  "symbols" gives each state its own glyph (blocked / working / done /
#  idle / unknown). Shape carries the info, color just backs it up (see
#  the `red`/`yellow`/`green` block in [theme.custom]).
# ══════════════════════════════════════════════════════════════════════
status_indicators = "symbols"

# "spaces" is the right pick with 1-2 agents: grouping by project wins.
# Switch to "priority" (urgency queue, whatever blocks you goes on top) the
# day several agents run in parallel: at 4 rows per agent, 6 agents = 24
# rows and the grouping gets unreadable.
agent_panel_sort = "spaces"
prompt_new_tab_name = false          # tabs name themselves (see rename plugin)
prompt_new_workspace_name = false
confirm_close = true

# ── Title written to the host terminal ───────────────────────────────
# Default: "{hostname}: {workspace}". {hostname} is noise locally, it's this
# machine. sketchybar only shows front_app, so this title is only for
# Mission Control and the app switcher; {terminal_title} adds what the
# agent is doing. Alacritty has dynamic_title = true, that's what shows it.
# Put {hostname} back if you use `herdr --remote`.
# Tokens: {hostname} {workspace} {tab} {pane} {terminal_title}
window_title = "{workspace} · {terminal_title}"

# ══════════════════════════════════════════════════════════════════════
#  Status bar (right edge of the tab bar)
#
#  Undocumented syntax: it's an INTERNALLY TAGGED enum, so `type =` is
#  required and the string form ("zoom") is rejected.
#    { type = "zoom" }
#    { type = "hostname" }
#    { type = "datetime", format = "%H:%M" }
#    { type = "text",     text = "..." }
#    { type = "command",  command = "...", interval_seconds = 30,
#                         timeout_seconds = 2 }
#  command/hostname/datetime entries are resolved by the herdr SERVER.
#  The binary has a "ui.tab_bar_right may contain at most N" check at
#  runtime that `config check` doesn't catch (it takes 16 entries without
#  complaining). Stick to 3 or 4.
#
#  ⚠ KNOWN LIMIT: hide_tab_bar_when_single_tab = true (above) hides the
#  tab bar when the space has only ONE tab, and this area with it. But a
#  single-tab space can have several panes, which is exactly when you zoom.
#  So the indicator only shows from two tabs up. To always have it, set
#  hide_tab_bar_when_single_tab to false (costs one row all the time).
#
#  `zoom` shows that a pane is zoomed (prefix+z). Without it nothing tells
#  you, you have to guess from the other panes being gone.
tab_bar_right = [
  { type = "zoom" },
]
tab_bar_right_separator = "   "

mouse_capture = true
copy_on_select = true
mouse_scroll_lines = 3

# Sidebar rows: compact, 2 rows max, no wasted space
# Built-in tokens for spaces:
#   state_icon  state_text  workspace  branch  git_status
# $ tokens come from WORKSPACE METADATA, published with
# `herdr workspace report-metadata <id> --source X --token NAME=VALUE`.
# It's the space-side version of what usagebar does for panes.
#
#   $sync   gap with the remote, fed by workflow-tools/herdr-space-metadata
#           ↑2 = 2 commits ahead   ↓1 = 1 behind   ⚑3 = 3 stashes
#
# On purpose it complements `git_status`, which shows the working tree
# (modified / staged): $sync shows the gap with upstream, which nothing
# showed before.
#
# NOT CHECKED: herdr doesn't say if it hides a row whose tokens are all
# empty or leaves a blank line. If clean spaces get an empty row in the
# sidebar, move $sync back to row 2:
#   ["branch", "git_status", { token = "$sync", dim = true }]
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$sync", dim = true }],
]

# ══════════════════════════════════════════════════════════════════════
#  AGENTS panel
#
#  History: herdr's default put ["state_icon","workspace","tab"] on ONE
#  row, three things in 24 columns, so everything got cut. The next version
#  split that over 4 rows, which fixed the cutting but got the ORDER wrong:
#  the bold row was the task title, the most volatile info (changes every
#  agent turn), with the project below it.
#
#  Rule here: what's STABLE anchors the entry, what's VOLATILE comes next,
#  NUMBERS go last and quiet.
#
#    row 1   state + WHERE          ◐ [1] ~
#    row 2   which agent, model     claude  Opus 5
#    row 3   what it uses, how hard  ⛁ 31% (311k)  ●●●○○ high
#    row 3   what it uses           ⛁ 31% (311k)  5h 54%
#    (blank row: row_gap = 1)
#
#  row_gap = 1 is the ONLY separator you get between two agents. Without
#  it, two 4-row entries touch and turn into a wall.
#
#  What you CAN'T do, and why there's no indent and no "·": herdr rejects
#  any literal text in a row ("unknown sidebar token; custom tokens must
#  start with $"). And a $ token holding only spaces gets silently dropped
#  (tested: it isn't even stored). So rows 2 to 4 sit flush left.
#
#  Built-in tokens for agents:
#    state_icon  state_text  workspace  tab  pane  agent
#    terminal_title  terminal_title_stripped
#
#  $ tokens come from PANE METADATA (`herdr pane report-metadata`).
#  These come from usagebar:
#    $context   context used by the pane           ⛁ 19% (186k)
#    $limit     shortest quota window               5h 82%
#               NOT SHOWN since 02/09. usagebar still produces it, it's
#               just not rendered. To bring it back, add
#               { token = "$limit", fg = "#8fbf9f" }
#               to row 3.
#    $provider  backend answering                   anthropic, ollama…
#    $title     terminal title, already cleaned
#
#  And this one comes from the same bridge as $model:
#    $effort    reasoning effort                    ●●●○○ high
#
#  Updated once the agent has SETTLED (not while it works), so the
#  numbers always match the last finished turn.
#
#  Inline style: { token = "x", fg = "#RRGGBB", bold = true, dim = true }
#  Only #RGB / #RRGGBB work, no color names here.
#
#  The per-agent override is gone: it only existed to put
#  terminal_title_stripped on row 1 for claude. That row now shows the
#  project for ALL agents and the title is on row 2 for everyone, so the
#  override had no point.
# ══════════════════════════════════════════════════════════════════════
# ── Colors ───────────────────────────────────────────────────────────
# The previous version had dim = true on rows 2 to 4: dim kills the hue,
# so EVERYTHING came out gray and only the space label kept a color. Here
# each row gets an explicit color and dim = false is set on purpose: the
# herdr docs say an omitted style field "preserve the contextual default",
# so leaving it out would let dim sneak back in.
#
# One color per KIND of info, not one per row:
#   identity   project        peach   #ffc799  the accent, bold
#   activity   what it does   mauve   #c4a7e7
#   who/where  agent          teal    #7fd9c4
#              tab            slate   #8aa0b8  pushed back on purpose
#   budget     used           amber   #e0b070  what's burned (warm)
#              left           sage    #8fbf9f  NOT SHOWN ANYMORE (see $limit)
#   effort     how it thinks  dark mauve #8f7fae  qualifies the model
#
# Effort gets a DARKER mauve, not its own color: it says nothing new, it
# qualifies the model right before it. Same family, lower rank (the
# "stable anchors, qualifier steps back" rule, inside one row). dim = true
# would look about the same but pushes the hue to gray (see above);
# darkening keeps the family link visible.
#
# Amber/sage used to mean: warm = going out, cool = what's left.
# Sage left with $limit; amber keeps its meaning on its own.
#
# fg takes any #RRGGBB, not just theme tokens.
# But there's NO background: only the foreground can be styled.
[ui.sidebar.agents]
row_gap = 1
# Three rows, no task title:
#   row 1   where    ◐ [1] ~                the [N] comes from the
#                                           automatic-rename plugin, it's
#                                           the prefix+N jump key
#   row 2   what     claude  Opus 5
#   row 3   budget   ⛁ 31% (311k)  ●●●○○ high
#
# The effort gauge is set by herdr-usagebar-statusline.
#
# First try: a single block from a ramp (▁ ▃ ▅ ▆ █). Didn't work, for a
# clear reason: a half-height block carries NO scale. You see "something
# in the middle" without knowing the middle of what.
#
# Five dots show the scale AND the position at once: five slots, three
# filled. Same as signal and battery icons, nothing to learn. And there
# are exactly five effort levels, so it maps one to one.
#
#   ●○○○○ low   ●●○○○ medium   ●●●○○ high   ●●●●○ xhigh   ●●●●● max
#
# The word stays next to it: the gauge gives the level at a glance, the
# word makes clear what's being measured.
#
# It's on ROW 3, not row 2, even if it'd logically sit next to the model.
# Width problem: "claude Opus 5 (1M context) ●●○○○ medium" is 39 columns
# in a 40-column sidebar, and herdr cuts it (the original problem of this
# panel). It still makes sense here: this row says what it uses, effort
# says how hard.
#
# The quota timer ($limit) shared this row and filled it for nothing: the
# gauge was there, but cut off. Between knowing how hard the agent runs
# and knowing in how many hours the quota window reopens, easy pick.
#
# It keeps the model's dark mauve instead of the nearby amber or sage:
# it's a SETTING, not a measurement, and the color says so.
#   row 3   budget   ⛁ 31% (311k)  5h 54%
#
# The task title was REMOVED, and the tab too. Both said the same thing:
# automatic-rename names the tab after the agent's terminal title, so
# "Corne keyboard directional" showed on row 2 (terminal_title_stripped)
# AND row 3 (tab).
#
# $model comes from workflow-tools/herdr-usagebar-statusline: the current
# model only exists in the JSON Claude Code passes to its statusLine
# command, no herdr token has it.
rows = [
  ["state_icon", { token = "workspace", bold = true, fg = "#ffc799", dim = false }],
  [{ token = "agent", fg = "#7fd9c4", dim = false }, { token = "$model", fg = "#c4a7e7", dim = false }],
  [{ token = "$context", fg = "#e0b070", dim = false }, { token = "$effort", fg = "#8f7fae", dim = false }],
]

# ─────────────────────────────────────────────────────────────
# Notifications: the main point of herdr, knowing which agent waits on you
# ─────────────────────────────────────────────────────────────
[ui.toast]
delivery = "system"                  # native macOS notif; "terminal" or "herdr" if you prefer
delay_seconds = 2

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

# ── Per-agent sounds ─────────────────────────────────────────────────
# Values: "default" | "on" | "off". Sounds only fire for BACKGROUND
# spaces, which is already what I want, so `claude` stays on "default":
# the key is here to be easy to find, not to change anything today.
# Setting an agent to "off" mutes it (herdr already does that for `droid`).
#
# Agent ids the binary knows:
#   pi  claude  codex  gemini  cursor  devin  cline  opencode  copilot
#   kimi  kiro  droid  amp  grok  hermes  kilo  qodercli  qwen  maki
[ui.sound.agents]
claude = "default"

[session]
resume_agents_on_restore = true      # resume conversations after a server restart

[worktrees]
directory = "~/.herdr/worktrees"

# ─────────────────────────────────────────────────────────────
# Keybindings
# ─────────────────────────────────────────────────────────────
[keys]
prefix = "ctrl+b"

switch_tab = "prefix+1..9"

# nvim-style splits (:sp / :vs), s below, v beside
split_horizontal = "prefix+s"
split_vertical   = "prefix+v"

# ══════════════════════════════════════════════════════════════════════
#  Navigation WITHOUT SHIFT
#
#  Fixed: by default herdr puts `next_tab` on prefix+n and
#  `new_workspace` on prefix+shift+n. Two very different actions on the
#  same letter, one of them needing Shift.
#
#  New layout, all lowercase:
#    n         new space          c       new tab
#    [  ]      prev/next space    ,  .    prev/next tab
#    /         rename space       ;       rename tab
#    '         close space        x       close pane
#    h j k l   focus between panes  1..9  go to tab N
# ══════════════════════════════════════════════════════════════════════

# ── Spaces ────────────────────────────────────────────────────────────
# w and g swapped compared to herdr defaults:
#   g = go to space  (was the picker on w)
#   w = goto         (was on g)
workspace_picker   = "prefix+g"
goto               = "prefix+shift+w"   # lowercase w went to the navigator (below)

new_workspace      = "prefix+n"      # n = new  (was next_tab)
rename_workspace   = "prefix+/"      # was prefix+shift+w
close_workspace    = "prefix+'"      # was prefix+shift+d
previous_workspace = "prefix+["      # sequential, no picker
next_workspace     = "prefix+]"

# ── Tabs ──────────────────────────────────────────────────────────────
new_tab      = "prefix+c"            # c = create (default, unchanged)
previous_tab = "prefix+,"            # < and > on the same keys
next_tab     = "prefix+."
rename_tab   = "prefix+;"            # was prefix+shift+t

# ── Agents: same idea as tabs, one step further ──────────────────────
# (prefix+9/0 not possible: switch_tab owns prefix+1..9)
previous_agent = "prefix+alt+,"
next_agent     = "prefix+alt+."

# ══════════════════════════════════════════════════════════════════════
#  Panes: TWO layouts, one per habit. No Shift.
#
#  1. prefix + i/j/k/l  =  same as AeroSpace (Hyper i/j/k/l).
#     Same cluster, same directions: i up, j left, k down, l right.
#     Same gesture, only the modifier changes.
#
#  2. alt + h/j/k/l     =  same as nvim, NO prefix.
#     Moves across herdr panes AND Neovim splits in one go
#     (vim-herdr-navigation plugin). This is the everyday one.
# ══════════════════════════════════════════════════════════════════════
focus_pane_up    = "prefix+i"
focus_pane_left  = "prefix+j"
focus_pane_down  = "prefix+k"
focus_pane_right = "prefix+l"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"      # jump straight to agent #N
last_pane = "prefix+backtick"        # toggle between two panes

# ══════════════════════════════════════════════════════════════════════
#  MOVE a pane (not the focus)
#
#  Half the gesture was missing: two layouts to move the FOCUS
#  (prefix+ijkl AeroSpace style, alt+hjkl nvim style) and none to move
#  the PANE itself.
#
#  AeroSpace puts `move` on Hyper+SEDF, can't do that here since prefix+s
#  is split_horizontal. So it's the same cluster as focus, plus Shift.
#  That breaks the "no Shift" rule of this file, on purpose: rearranging
#  a pane is rare, navigating isn't.
#
#  Checked: herdr maps `prefix+shift+i` and `prefix+I` to the SAME key,
#  and Alacritty does send "I" for shift+i. The binding fires.
# [SUSPENDED 2026-08-27] swap_pane_up    = "prefix+shift+i"
# [SUSPENDED 2026-08-27] swap_pane_left  = "prefix+shift+j"
# [SUSPENDED 2026-08-27] swap_pane_down  = "prefix+shift+k"
# [SUSPENDED 2026-08-27] swap_pane_right = "prefix+shift+l"

# ── Reorder tabs ─────────────────────────────────────────────────────
#  prefix+, / prefix+. switch tabs; < and > PUSH them.
#
#  ⚠ Written "prefix+<", not "prefix+shift+,": for herdr those are two
#  DIFFERENT keys (checked through collisions: shift+, and shift+comma
#  clash with each other, but not with <). herdr only implements the kitty
#  keyboard protocol on the pane side (src/pane/kitty_keyboard.rs), not on
#  the client side, so Alacritty sends it the "<" char, not "shift+comma".
#  Written any other way, this binding would never fire.
# [SUSPENDED 2026-08-27] move_tab_previous = "prefix+<"
# [SUSPENDED 2026-08-27] move_tab_next     = "prefix+>"

# herdr default, made explicit because it's too handy to stay hidden:
# opens the pane's WHOLE scrollback in $EDITOR. To reread 2000 lines of
# agent output it beats copy-mode: you get search, tree-sitter text
# objects and Doom marks.
# [SUSPENDED 2026-08-27] edit_scrollback = "prefix+e"

# Navigate mode: local vim-style moves
navigate_pane_left  = "h"
navigate_pane_down  = "j"
navigate_pane_up    = "k"
navigate_pane_right = "l"

# Tool popups: open on top, close when the process exits
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+d"
type = "popup"
command = "lazydocker"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+b"
type = "popup"
command = "btop"
width = "90%"
height = "90%"

# alt+k = kill: find a process by name and kill it.
# btop (alt+b) can kill too, but it's a monitor, you go there to look.
# pk is the other way round, you go there to act, and the fuzzy search
# covers the name AND the full command line.
[[keys.command]]
key = "prefix+alt+k"
type = "popup"
command = "pk"
width = "92%"
height = "88%"

# alt+e = edit: rename or delete a space / session.
# Safe path: a popup has a real terminal, so fzf and gum work fine there.
# The same actions exist in the navigator (prefix+w, Ctrl-N), where they
# run inside the picker's pane.
[[keys.command]]
key = "prefix+alt+e"
type = "popup"
command = "herdr-manage"
width = "70%"
height = "60%"

# alt+f = floating: a spare shell floating over your work, one per space,
# keeps its state between openings. For "I need to type a command"
# without messing up the current layout.
[[keys.command]]
key = "prefix+alt+f"
type = "plugin_action"
command = "herdr-floax.toggle"
description = "shell flottant (floax)"

# alt+m = markdown: browse ~/.config/docs as rendered Markdown.
# `mdv` wraps glow: in glow 3.0.0 the config file and GLAMOUR_STYLE are
# ignored, only the -s flag works.
[[keys.command]]
key = "prefix+alt+m"
type = "popup"
command = "mdv ~/.config/docs"
width = "88%"
height = "86%"

# ── Plugin actions ────────────────────────────────────────────

# vim-herdr-navigation: alt+h/j/k/l moves across herdr panes AND nvim splits.
# NOT ctrl+h/j/k/l: herdr grabs those keys WITHOUT prefix, so
#   ctrl+l no longer reached the shell (clear-screen)
#   ctrl+h no longer reached tmux (HELP mode), and it's also backspace
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# a = actions: fzf palette of EVERYTHING bindable
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "jt.command-palette.open"
description = "command palette"

# f = files: git-aware explorer in a split
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "file viewer (split)"

# d = diff: review the agent's work
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr (toggle)"

# w = where: the navigator, fuzzy jump to space / agent / project / session.
# The universal entry point: when you don't know where something is, w.
# (prefix+i is focus pane UP like AeroSpace; goto moved to
#  prefix+shift+w.)
#
# Goes through herdr-navigator-fresh instead of the plugin action: the
# navigator reads projects from herdr-plus TOML templates, which only
# change when herdr-sync-projects runs. A repo cloned since the last sync
# stayed invisible. The wrapper syncs first, then opens the same picker.
#
# Costs nothing most of the time: `--if-needed` just compares two lists of
# names and exits if nothing changed. If the sync fails, the navigator
# still opens on the existing index.
[[keys.command]]
key = "prefix+w"
type = "shell"
command = "$HOME/.config/workflow-tools/herdr-navigator-fresh"
description = "navigator (index resynchronise)"

# alt+shift+w = the raw navigator, no sync. Handy if the sync gets slow or
# noisy: same picker, direct path.
[[keys.command]]
key = "prefix+alt+shift+w"
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator (sans resynchro)"

# alt+w = same thing, in a side pane instead of full screen
[[keys.command]]
key = "prefix+alt+w"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "navigator (pane lateral)"

# alt+i = go back where you were after a navigator jump
[[keys.command]]
key = "prefix+alt+i"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "navigator: revenir en arriere"

# m = memex: search agent transcripts
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "nicosuave.memex.palette"
description = "memex (sessions)"

# t / u = termscope: open a file / link visible on screen
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "termscope.open"
description = "termscope: fichiers visibles"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "termscope.open-links"
description = "termscope: liens visibles"

# h = home: the non-project space for repos, system, files, updates.
# Template: projects/00-quotidien.toml.
#
# Goes through herdr-open-project, not `herdr-plus open` directly: that one
# ALWAYS creates a new space (workspaceCreate), so pressing twice gave two
# "quotidien". The script focuses the existing one.
#
# Absolute path: a `type = "shell"` binding runs detached and doesn't
# always inherit the login shell's PATH.
[[keys.command]]
key = "prefix+h"
type = "shell"
command = "$HOME/.config/workflow-tools/herdr-open-project quotidien"
description = "space quotidien (hors projet)"

# p = projects: brings up a project's whole workspace (tabs + commands).
# prefix+p was free: herdr's default had `previous_tab` there, moved to
# prefix+, above. The letter matches the word, and it's one key less than
# the old prefix+alt+o.
#
# Two ways to reach projects, on purpose:
#   prefix+p         dedicated picker, grouped by `group` (python / node / system)
#   prefix+w Ctrl+P  `project` filter in the navigator, next to the spaces
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

# alt+a = quick Actions: fuzzy launcher, in the current directory
[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

# ══════════════════════════════════════════════════════════════════════
#  Plugins added 2026-08-20
#  Mnemonic: the letter = the word. Shift = variant/management.
# ══════════════════════════════════════════════════════════════════════

# alt+v = lazygit in a side pane (v for "version control").
# prefix+g = goto, prefix+shift+g = new_worktree: don't touch.
# prefix+alt+g stays your existing lazygit popup.
[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "herdr-lazygit.open"
description = "lazygit (pane)"

# alt+z = zoxide (prefix+z is herdr's `zoom`)
[[keys.command]]
key = "prefix+alt+z"
type = "plugin_action"
command = "herdr-zoxide.browse"
description = "zoxide -> workspace"

# y = yazi: file explorer
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "ray.file-explorer.open"
description = "yazi (explorateur)"

# alt+u = usage: agents' context gauges and rate limits
[[keys.command]]
key = "prefix+alt+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "usage & limites des agents"

# shift+u = the SAME info, recomputed right now. Follows this file's rule
# "Shift = variant/management". The sidebar counters only refresh once the
# agent has SETTLED (never while it works); this forces $context and
# $limit to recompute without waiting.
# [SUSPENDED 2026-08-27] [[keys.command]]
# [SUSPENDED 2026-08-27] key = "prefix+shift+u"
# [SUSPENDED 2026-08-27] type = "plugin_action"
# [SUSPENDED 2026-08-27] command = "usagebar.refresh"
# [SUSPENDED 2026-08-27] description = "usagebar : recalculer $context / $limit"

# alt+t = tokens: live spend (prefix+shift+t is herdr's rename_tab)
[[keys.command]]
key = "prefix+alt+t"
type = "plugin_action"
command = "dave.token-dashboard.open-dashboard"
description = "dashboard tokens"

# alt+l = llmtrim (prefix+shift+l is already next_workspace)
[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
command = "llmtrim.proxy.summary"
description = "llmtrim (economie de contexte)"

# alt+p = plugins (prefix+shift+p is herdr's rename_pane)
[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "gestionnaire de plugins"

# alt+r = retry (prefix+r is herdr's resize_mode)
[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "claude-auto-retry.status"
description = "claude auto-retry (statut)"

[experimental]
# Keeps pane screen history across a FULL server restart. Goes with
# resume_agents_on_restore = true: without it the agent picks up its
# conversation but the screen starts empty.
# herdr marks it experimental, keep an eye on it.
# [SUSPENDED 2026-08-27] pane_history = true

kitty_graphics = false               # Alacritty does NOT implement the kitty
                                     # graphics protocol (Ghostty does). Set back
                                     # to true if you go back to Ghostty/kitty.

[advanced]
scrollback_limit_bytes = 10000000
