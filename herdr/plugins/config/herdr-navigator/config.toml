# Herdr Navigator default config
# Location after first run:
#   $(herdr plugin config-dir herdr-navigator)/config.toml

[picker]
# What happens after selecting an entry:
# - true: focus an already-open workspace for the selected path
# - false: always use create_missing behavior
reuse_existing = true

# Create a new Herdr workspace when the selected path is not open yet.
create_missing = true

# Prefix new workspace labels with their Navigator kind (project: / dir:).
#
# Set to false: in a 28-column sidebar, "project: " ate 9 chars on every
# label for info the icon and context already give. "a-long-project" reads
# fine, "project: a-long-pr…" doesn't. Navigator still remembers the kind
# on its side.
prefix_workspace_labels = false

# Search engine: "nucleo" | "skim" | "simple"
# - nucleo: best default; fast, fzf-like scoring, good Unicode support
# - skim: skim/fzf-style matcher via fuzzy-matcher crate
# - simple: tiny built-in ordered-character matcher for debugging
engine = "nucleo"

# Source priority controls initial ordering and tie/near-tie ranking.
# Accepted names: agent, server/remote, workspace/open, project, session, zoxide, root, quick, plugin.
# Three tiers, in this order:
#   1. what EXISTS and runs        workspace, agent, session, server
#   2. what you can CREATE         plugin (entries from herdr-nav-create)
#   3. what's just a TEMPLATE      project
# The 28 projects are still there (Ctrl-P) but can't take over the top of
# the list anymore.
source_order = ["workspace", "agent", "session", "server", "plugin", "project", "zoxide", "root", "quick"]

# How strongly source_order influences search ranking.
# Set 0 for pure matcher score.
source_priority_boost = 5

# Agent view sorting for `@` and Ctrl-A:
# - herdr: read Herdr's agent_panel_sort setting
# - priority: blocked/error, attention/request, done, working, then idle
# - spaces: keep Herdr/pane order
agent_sort = "herdr"

# Show the right-side preview pane on open. Ctrl-O toggles it at runtime.
preview = true

# Use Herdr-style source-aware rows: metadata aligns right, while zoxide/root
# entries expand to a second full-path line. Set false for the compact list.
detailed_rows = true

# ── Tree view: tabs under their space ────────────────────────────────
# A space's tabs show up as child rows in the "open" section, right
# under it:
#
#   [3] project: a-long-project         2 tabs · 3 panes
#     ├ agent                           tab 1
#     └ run                             tab 4 · 2 panes
#
# Same idea as tmux's `choose-tree`. The order holds because the picker
# falls back to insertion order on equal scores.
# Ctrl-X on a child row closes the TAB, not the space.
tab_children = true

# Below this many tabs, no children: a space's only tab would just repeat
# the space row and tell you nothing. Set to 1 to show everything anyway.
tab_children_min = 2

# Check GitHub releases in the background at most once per day. Network errors
# are ignored; a newer version appears as a badge in the Navigator header.
check_updates = true

# Optional Herdr Plus project filename. Alt-Enter applies its tabs/panes to the
# selected zoxide/root dir, appending new tabs if its workspace already exists.
# directory_template = "default.toml"
# directory_template_key = "alt-enter" # also accepts Ctrl forms such as "ctrl-g"

# Vim-style normal mode: j/k move, source keys filter, and / starts searching.
vim_mode = false

# Start searching immediately after a Vim source-filter key.
vim_filter_search = false

# Source filter shortcuts. Defaults: server=ctrl-s, agent=ctrl-a, quick=ctrl-q,
# workspace=ctrl-w, project=ctrl-p, zoxide=ctrl-z, root=ctrl-r, session=ctrl-l.
#
# One letter = the initial of what it filters. The defaults mixed
# initials (w, a, p, q) with random keys (l for session, s for server):
# impossible to remember without the help screen.
#
#   Ctrl-W  Workspaces        open spaces
#   Ctrl-A  Agents            running agents
#   Ctrl-L  Sessions          plugin default
#   Ctrl-G  Gateways          remote herdr servers
#   Ctrl-N  New               everything you can create
#   Ctrl-P  Projects          herdr-plus templates
#
# CTRL-S IS OFF LIMITS, and it's not a matter of taste.
# `stty -a' on this terminal shows `ixon' on and `stop = ^S': Ctrl-S is
# the software flow control XOFF. It FREEZES terminal output: you type,
# nothing shows, the screen looks broken. (Ctrl-Q unfreezes.)
# An older version put sessions on ctrl-s for the initial; that was a bug.
# The plugin's own default puts servers on ctrl-s: same trap, never hit
# here since no server is configured.
#
# Avoid these for the same reason: ^Q (start), ^Z (susp), ^C (intr),
# ^D (eof), ^H (backspace). Ctrl-C/U/X/B/O/H stay with the picker itself.
[picker.filter_keys]
workspace = "ctrl-w"
agent     = "ctrl-a"
session   = "ctrl-l"
server    = "ctrl-g"
plugin    = "ctrl-n"
project   = "ctrl-p"

[notifications]
# Show Navigator success/error notifications.
enabled = true
# Enable notification audio. Notifications remain visible when this is false.
audio = false
# Audio mode when enabled: "default" uses Herdr's done/request sounds;
# "custom" plays custom_sound with afplay (macOS) or pw-play/paplay/aplay (Linux).
sound = "default"
custom_sound = "" # Example: "~/sounds/navigator.wav"

[jump_back]
# Master switch for Jump Back.
# - true: remember successful local workspace changes and enable the jump-back action
# - false: do not record, pin, or jump; any saved history is kept for later re-enabling
# The global keybinding itself belongs in Herdr's main config; see README.md.
enabled = true

# Put the previous workspace first when the picker opens with no query or source filter.
# This only changes the initial view; typed searches and Ctrl source filters keep normal ranking.
pin_previous = true

[sources]
# Existing Herdr workspaces. Selecting focuses the workspace.
open_workspaces = true

# Herdr Plus project templates from:
# ~/.config/herdr/plugins/config/cloudmanic.herdr-plus/projects/*.toml
#
# ON, but ranked AFTER the live stuff in source_order: Ctrl-P isolates
# them, like Ctrl-W for spaces and Ctrl-L for sessions.
# Dedicated grouped picker: prefix+p.
herdr_plus_projects = true

# zoxide history from `zoxide query -l`.
#
# OFF: 37 entries, more than half the index. zoxide already has its own
# picker with preview: prefix+alt+z.
zoxide = false

# Direct filesystem scan of [[roots]] below.
#
# OFF: the default [[roots]] (~/workspace, ~/projects) don't exist on this
# machine, so the source returned nothing. Projects live in
# ~/Desktop/projects and are covered by prefix+alt+o.
roots = false

# Agent panes from Herdr pane metadata. Selecting focuses the agent.
agents = true

# Remote Herdr targets from remote entries in [sessions] below.
servers = true
# Local Herdr sessions from `herdr session list --json` and local [sessions] entries below.
sessions = true

# Herdr Plus Quick Actions.
#
# OFF: this source added just ONE entry, whose action was to open another
# picker. A picker inside a picker is a detour, not a path. Quick actions
# have their own key: prefix+alt+a.
herdr_plus_quick_actions = false

[theme]
# Optional Navigator base palette. Supports the same named palettes as Herdr,
# for example "dracula", "nord", and "tokyo-night".
# name = "dracula"
#
# Read ~/.config/herdr/config.toml theme and [theme.custom] tokens when name is unset.
# If name is set and inheritance remains enabled, inherited Herdr custom tokens
# layer over that base; Navigator [theme.custom] tokens below win over both.
inherit_herdr = true
#
# [theme.custom]
# accent = "#ff00ff"

# Keep roots short; zoxide should handle most frequent directories.
[[roots]]
path = "~/workspace"
max_depth = 3

[[roots]]
path = "~/projects"
max_depth = 3

# Optional agent aliases. All match fields are optional and matched as text contains.
# Aliases become extra search terms for matching agent panes.
#
# [[agent_aliases]]
# alias = "main ai dot"
# agent = "claude"
# workspace = "Dotfiles"
# path = "dotfiles"

[sessions]
# Include local named sessions from `herdr session list --json`.
local = true

# Manual remote targets. Selecting runs: herdr --remote <remote> --handoff.
# [[sessions.entries]]
# name = "prod"
# remote = "prod-api"
# tags = ["prod", "api"]

# Optional command/JSON integrations. A plugin only needs:
# - collect: command that prints JSON array
# - open: command to run when the item is selected
#
# [[integrations]]
# id = "demo"
# label = "Bookmarks"
# enabled = true
# collect = "bookmarks list --json"
# open = "bookmarks open {{id}}"
# notify_success = true
# notify_error = true
#

# ── Create, from the navigator ────────────────────────────────────────
# herdr-nav-create emits the entries; herdr-new runs the action.
#   ⚡ scratch      throwaway space (shell + opencode) in ~/scratch/<date>
#   ＋ space ici    space on the focused pane's directory, computed each
#                   time the picker opens
#   ＋ session X    new Alacritty window on a named session;
#                   kind = "session" -> the entry shows under Ctrl-L,
#                   next to the sessions that already exist
[[integrations]]
id = "create"
label = "créer"
enabled = true
collect = "$HOME/.config/workflow-tools/herdr-nav-create"
open = "$HOME/.config/workflow-tools/herdr-new {{id}} {{path}}"
notify_success = true
notify_error = true

# ── Tabs, under their space ───────────────────────────────────────────
# OFF, replaced by the real tree view on the plugin side.
#
# This integration worked, but put its entries in a separate "tabs"
# section. The reason is in the plugin code (src/integrations/command.rs):
# an integration entry's `kind` field only means something for three
# values:
#   "server" | "remote-terminal"  ->  Source::Server
#   "session"                     ->  Source::Session
#   anything else                 ->  Source::Integration
# There's NO path to Source::Workspace, i.e. the "open" section. So an
# integration simply can't put rows under spaces.
#
# The tree view is now native: see [picker].tab_children above. Tabs are
# child rows of the `open` source, in space -> its tabs order, like tmux's
# `choose-tree`.
#
# Setting `enabled = true` below would show each tab TWICE: once under
# its space, once in the "tabs" section.
[[integrations]]
id = "tabs"
label = "tabs"
enabled = false
collect = "$HOME/.config/workflow-tools/herdr-nav-tabs"
open = "$HOME/.config/workflow-tools/herdr-nav-goto-tab {{id}} {{path}}"
notify_success = false
notify_error = true

# ── All plugin actions ────────────────────────────────────────────────
# The Ctrl-N filter is called "plugin" but shows `Source::Integration`,
# i.e. the [[integrations]] blocks of THIS file, not herdr plugins. Hence
# the feeling it only had space management.
#
# This integration feeds it the 61 actions actually exposed by the 20
# installed plugins (`herdr plugin action list`). So Ctrl-N becomes the
# full catalog: homemade create entries + every action.
#
# The navigator's own actions are left out: running them from the
# navigator would open a navigator inside the navigator.
#
# Another way to the same thing, already set up: prefix+a
# (jt.command-palette), which lists everything bindable.
[[integrations]]
id = "actions"
label = "action"
enabled = true
collect = "$HOME/.config/workflow-tools/herdr-nav-actions"
open = "$HOME/.config/workflow-tools/herdr-nav-invoke {{id}}"
notify_success = false
notify_error = true
