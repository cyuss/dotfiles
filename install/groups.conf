# Groupes d'installation — nom | defaut | description
#
# « defaut » indique si le groupe est preselectionne dans le mode
# interactif et inclus par --recommended. Les groupes marques 0 sont
# utiles mais pas necessaires pour que la configuration fonctionne.
#
# L'ordre de ce fichier est l'ordre d'installation : core d'abord,
# les polices avant les applications qui les nomment.
core|1|Socle indispensable — git, fd, ripgrep, bat, eza, delta, fzf, zoxide, atuin
fonts|1|Polices — JetBrainsMono Nerd Font, Symbols, SF Pro (nommees par Doom et Alacritty)
shell|1|Shell — antidote, oh-my-posh, carapace, completions, fastfetch
term|1|Terminal — Alacritty et herdr (multiplexeur)
dev|1|Developpement — uv, ruff, just, watchexec, direnv, gh, lazygit, jj
editor|0|Editeurs — Emacs (emacs-plus@30) et Neovim
wm|0|Fenetres — AeroSpace et Karabiner-Elements
tui|0|TUIs — btop, yazi, broot, navi, television, lazydocker, glow, gum
search|0|Recherche — sd, serpl, ast-grep, semgrep
data|0|Donnees — dasel, miller, gron, jless, yq, visidata, pgcli, litecli, lazysql
net|0|Reseau — trippy, gping, xh, doggo, bandwhich, nmap
prose|0|Ecriture — languagetool, vale, typioca
